<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal Element Blocker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Element Blocker</h1>
          <p id="current-host">กำลังอ่านเว็บไซต์…</p>
        </div>
        <label class="switch" title="เปิดหรือปิดบนเว็บไซต์นี้">
          <input id="site-enabled" type="checkbox" checked />
          <span></span>
        </label>
      </header>

      <form id="rule-form">
        <label>
          ประเภทกฎ
          <select id="rule-type">
            <option value="url">ข้อความใน URL/attribute</option>
            <option value="selector">CSS selector</option>
          </select>
        </label>

        <label>
          ค่าที่ต้องการบล็อก
          <input
            id="rule-value"
            type="text"
            placeholder="เช่น ibit.ly หรือ .popup-ad"
            autocomplete="off"
            required
          />
        </label>

        <label>
          การทำงาน
          <select id="rule-action">
            <option value="remove">ลบ element</option>
            <option value="hide">ซ่อน element</option>
          </select>
        </label>

        <button type="submit">เพิ่มกฎ</button>
        <p id="form-error" role="alert" aria-live="polite"></p>
      </form>

      <section aria-labelledby="rules-title">
        <h2 id="rules-title">กฎทั้งหมด</h2>
        <p id="empty-state">ยังไม่มีกฎ</p>
        <ul id="rules-list"></ul>
      </section>

      <section class="rule-tools" aria-label="จัดการกฎ">
        <button id="export-rules" type="button">ส่งออกกฎ</button>
        <button id="import-rules" type="button">นำเข้ากฎ</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden />
        <p id="import-status" role="status" aria-live="polite"></p>
      </section>

      <section class="shortcut-settings" aria-labelledby="shortcut-title">
        <h2 id="shortcut-title">ตั้งค่าคีย์ลัด</h2>
        <div class="shortcut-row">
          <input id="picker-shortcut" type="text" value="Alt + Q" readonly aria-label="ปุ่มลัดปัจจุบัน" />
          <button id="change-shortcut" type="button">เปลี่ยนคีย์ลัด</button>
        </div>
        <p id="shortcut-status" role="status" aria-live="polite">คลิกเปลี่ยนคีย์ลัด แล้วกดชุดปุ่มใหม่</p>
      </section>

      <footer>
        <div>
          <strong>โหมดคลิกเพื่อลบ</strong>
          <p id="picker-status">Inactive</p>
        </div>
        <label class="switch" title="เปิดหรือปิดโหมดคลิกเพื่อลบบนเว็บ">
          <input id="picker-enabled" type="checkbox" />
          <span></span>
        </label>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
